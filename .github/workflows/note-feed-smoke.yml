name: Verify automatic note feed
on:
  push:
    branches: [cloudflare-site]
    paths:
      - 'functions/api/note.js'
      - 'server/note-feed.js'
      - 'site/assets/note-feed.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/note-live-smoke.py'
      - '.github/workflows/note-feed-smoke.yml'
permissions:
  contents: read
jobs:
  note-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: node tests/note-feed.test.js
      - name: Verify public RSS-backed endpoint after deployment
        run: python3 tests/note-live-smoke.py
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public feed and deployed route
        shell: python
        run: |
          import urllib.request, urllib.error
          for url in ['https://note.com/adult_curiosity/rss', 'https://adult-curiosity.pages.dev/api/note', 'https://60f7941c.adult-curiosity.pages.dev/api/note']:
              try:
                  request = urllib.request.Request(url, headers={'Accept': '*/*', 'User-Agent': 'AdultCuriosityLab-FeedCheck/1.0'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(url, response.status, response.headers.get('Content-Type'), response.read(3500).decode('utf-8', errors='replace'))
              except urllib.error.HTTPError as error:
                  print(url, error.code, error.read(3500).decode('utf-8', errors='replace'))
              except Exception as error:
                  print(url, type(error).__name__, str(error))
